name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPO: ${{ secrets.ECR_REPOSITORY }}

jobs:

# ---------------------------
# 1. SECURITY SCAN
# ---------------------------
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

# ---------------------------
# 2. DETECT CHANGES (COST OPTIMIZATION)
# ---------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker_changed: ${{ steps.filter.outputs.changed }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        run: |
          git fetch origin main
          CHANGED=$(git diff --name-only origin/main HEAD)

          echo "$CHANGED"

          if echo "$CHANGED" | grep -E 'Dockerfile|server/|client/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

# ---------------------------
# 3. BUILD + PUSH TO ECR (ONLY IF CHANGED)
# ---------------------------
  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker_changed == 'true'

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set IMAGE TAG (commit SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPO:$IMAGE_TAG -f dockerfile-2 .

      - name: Tag Image
        run: |
          docker tag $ECR_REPO:$IMAGE_TAG \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG

      - name: Push Image to ECR
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG

# ---------------------------
# 4. DEPLOY VIA SSM
# ---------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:

      - name: Deploy to EC2 via SSM
        run: |

          aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /home/ubuntu/app",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com",
              "docker compose pull",
              "docker compose down",
              "docker compose up -d",
              "docker image prune -f"
            ]' \
            --region ${{ secrets.AWS_REGION }}

# ---------------------------
# 5. NOTIFICATION (OUTLOOK SMTP)
# ---------------------------
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:

      - name: Send Email Notification
        run: |
          python3 - <<EOF
          import smtplib
          from email.mime.text import MIMEText
          import os

          sender = os.environ["OUTLOOK_EMAIL"]
          password = os.environ["OUTLOOK_PASSWORD"]

          receiver = sender

          subject = "CI/CD Pipeline Status: ${{ job.status }}"
          body = f"""
Status: ${{ job.status }}
Repo: ${{ github.repository }}
Commit: ${{ github.sha }}
"""

          msg = MIMEText(body)
          msg["Subject"] = subject
          msg["From"] = sender
          msg["To"] = receiver

          server = smtplib.SMTP("smtp.office365.com", 587)
          server.starttls()
          server.login(sender, password)
          server.sendmail(sender, receiver, msg.as_string())
          server.quit()
          EOF
        env:
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
